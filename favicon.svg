<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Pill/oval orange background -->
  <rect x="14" y="4" width="36" height="56" rx="18" ry="18" fill="#B5662B"/>
  <!-- Inner thin white border -->
  <rect x="16" y="6" width="32" height="52" rx="16" ry="16" fill="none" stroke="#FDFAF4" stroke-width="0.6" opacity="0.9"/>
  <!-- Top dot (head) -->
  <circle cx="32" cy="14" r="2.6" fill="#1A1612"/>
  <!-- Top stone : cream/beige rounded ellipse -->
  <ellipse cx="32" cy="24" rx="9" ry="4" fill="#E4D9BC"/>
  <!-- Middle stone : sand rounded ellipse -->
  <ellipse cx="32" cy="33" rx="11" ry="4.6" fill="#C8865A"/>
  <!-- Bottom stone : olive rounded ellipse -->
  <ellipse cx="32" cy="44" rx="13" ry="5.4" fill="#4A5240"/>
</svg>
